openapi: 3.1.0
info:
  title: Agent Skill Factory Registry API
  version: 0.5.0
  description: GitHub-backed API for first-class Skills, Flows, Suites, and Factory modules.
servers:
  - url: https://YOUR-VERCEL-DOMAIN.vercel.app
paths:
  /api/health:
    get: {operationId: healthCheck, summary: Check the Factory API., responses: {'200': {description: OK}}}
  /api/factory-module:
    get:
      operationId: getFactoryModule
      summary: Load a current Factory module.
      parameters:
        - {in: query, name: name, required: true, schema: {type: string, enum: [orchestrator, architect, author, reviewer, publisher]}}
        - {in: query, name: ref, required: false, schema: {type: string}}
      responses: {'200': {description: OK}}
  /api/factory-file:
    get:
      operationId: getFactoryFile
      summary: Read one UTF-8 source file from the Factory repository.
      parameters:
        - {in: query, name: path, required: true, schema: {type: string}}
        - {in: query, name: ref, required: false, schema: {type: string}}
      responses: {'200': {description: OK}}
  /api/skills:
    get:
      operationId: listSkills
      summary: List Skills.
      parameters: &listParams
        - {in: query, name: visibility, required: true, schema: {type: string, enum: [public, private]}}
        - {in: query, name: ref, required: false, schema: {type: string}}
      responses: {'200': {description: OK}}
  /api/search-skills:
    get:
      operationId: searchSkills
      summary: Search Skills by name and SKILL.md metadata.
      parameters: &searchParams
        - {in: query, name: query, required: true, schema: {type: string}}
        - {in: query, name: visibility, required: true, schema: {type: string, enum: [public, private]}}
        - {in: query, name: limit, required: false, schema: {type: integer, minimum: 1, maximum: 20, default: 5}}
        - {in: query, name: ref, required: false, schema: {type: string}}
      responses: {'200': {description: OK}}
  /api/skill:
    get:
      operationId: getSkill
      summary: Load a Skill's SKILL.md.
      parameters: &getParams
        - {in: query, name: visibility, required: true, schema: {type: string, enum: [public, private]}}
        - {in: query, name: name, required: true, schema: {type: string}}
        - {in: query, name: ref, required: false, schema: {type: string}}
      responses: {'200': {description: OK}}
  /api/skill-file:
    get:
      operationId: getSkillFile
      summary: Load one text resource within a Skill.
      parameters:
        - {in: query, name: visibility, required: true, schema: {type: string, enum: [public, private]}}
        - {in: query, name: name, required: true, schema: {type: string}}
        - {in: query, name: path, required: true, schema: {type: string}}
        - {in: query, name: ref, required: false, schema: {type: string}}
      responses: {'200': {description: OK}}
  /api/flows:
    get: {operationId: listFlows, summary: List saved Flows., parameters: *listParams, responses: {'200': {description: OK}}}
  /api/search-flows:
    get: {operationId: searchFlows, summary: Search saved Flows independently from Skill discovery., parameters: *searchParams, responses: {'200': {description: OK}}}
  /api/flow:
    get: {operationId: getFlow, summary: Load a Flow's FLOW.json., parameters: *getParams, responses: {'200': {description: OK}}}
  /api/suites:
    get: {operationId: listSuites, summary: List Suites., parameters: *listParams, responses: {'200': {description: OK}}}
  /api/search-suites:
    get: {operationId: searchSuites, summary: Search Suites., parameters: *searchParams, responses: {'200': {description: OK}}}
  /api/suite:
    get: {operationId: getSuite, summary: Load a Suite's SUITE.json., parameters: *getParams, responses: {'200': {description: OK}}}
  /api/skill-history:
    get:
      operationId: getSkillHistory
      summary: Legacy-compatible history endpoint for a Skill, Flow, Suite, or Factory module.
      parameters: &historyParams
        - {in: query, name: target, required: false, schema: {type: string, enum: [skill, flow, suite, factory], default: skill}}
        - {in: query, name: visibility, required: false, schema: {type: string, enum: [public, private]}}
        - {in: query, name: name, required: true, schema: {type: string}}
        - {in: query, name: ref, required: false, schema: {type: string}}
      responses: {'200': {description: OK}}
  /api/registry-history:
    get:
      operationId: getRegistryHistory
      summary: Get history for a Skill, Flow, Suite, or Factory module.
      parameters: *historyParams
      responses: {'200': {description: OK}}
  /api/create-branch:
    post:
      operationId: createChangeBranch
      summary: Create a change branch.
      requestBody: &branchBody
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              properties:
                target: {type: string, enum: [skill, registry, factory], default: skill}
                visibility: {type: string, enum: [public, private]}
                branch: {type: string}
                base: {type: string}
      responses: {'200': {description: OK}}
  /api/write-files:
    post:
      operationId: writeRegistryFiles
      summary: Create or replace UTF-8 text files on a change branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch, files]
              properties:
                target: {type: string, enum: [skill, registry, factory], default: skill}
                visibility: {type: string, enum: [public, private]}
                branch: {type: string}
                message: {type: string}
                files:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [path, content]
                    properties: {path: {type: string}, content: {type: string}}
      responses: {'200': {description: OK}}
  /api/delete-file:
    post:
      operationId: deleteRegistryFile
      summary: Delete one Registry text file on a change branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch, path]
              properties:
                target: {type: string, enum: [skill, registry, factory], default: skill}
                visibility: {type: string, enum: [public, private]}
                branch: {type: string}
                path: {type: string}
                message: {type: string}
      responses: {'200': {description: OK}}
  /api/validate-skill:
    post:
      operationId: validateSkill
      summary: Validate proposed SKILL.md text and scan obvious secrets.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [skillMd], properties: {skillMd: {type: string}}}}}
      responses: {'200': {description: OK}}
  /api/validate-flow:
    post:
      operationId: validateFlow
      summary: Validate a proposed or stored FLOW.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility, name]
              properties:
                visibility: {type: string, enum: [public, private]}
                name: {type: string}
                ref: {type: string}
                flowJson: {type: string}
      responses: {'200': {description: OK}}
  /api/validate-suite:
    post:
      operationId: validateSuite
      summary: Validate a proposed or stored SUITE.json.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility, name]
              properties:
                visibility: {type: string, enum: [public, private]}
                name: {type: string}
                ref: {type: string}
                suiteJson: {type: string}
      responses: {'200': {description: OK}}
  /api/compare:
    get:
      operationId: compareChangeBranch
      summary: Compare a change branch against its base.
      parameters:
        - {in: query, name: target, required: false, schema: {type: string, enum: [skill, registry, factory], default: skill}}
        - {in: query, name: visibility, required: false, schema: {type: string, enum: [public, private]}}
        - {in: query, name: head, required: true, schema: {type: string}}
        - {in: query, name: base, required: false, schema: {type: string}}
      responses: {'200': {description: OK}}
  /api/pull-request:
    post:
      operationId: openSkillPullRequest
      summary: Open a pull request from a prepared branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [head, title]
              properties:
                target: {type: string, enum: [skill, registry, factory], default: skill}
                visibility: {type: string, enum: [public, private]}
                head: {type: string}
                base: {type: string}
                title: {type: string}
                body: {type: string}
      responses: {'200': {description: OK}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
security:
  - bearerAuth: []
